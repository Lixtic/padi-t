name: GuidEd quality checks

on:
  pull_request:
    paths:
      - 'hearth-planner/**'
      - '.github/workflows/guided-quality.yml'
  push:
    branches: [main]
    paths:
      - 'hearth-planner/**'
      - '.github/workflows/guided-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Build and regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearth-planner
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hearth-planner/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Build generated application assets
        run: npm run build
      - name: Run regression and product-principle tests
        run: npm test
      - name: Check Python export modules
        run: python -m compileall -q api lib
